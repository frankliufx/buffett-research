# A股政策主题知识库 (v1 — AI 起草，待人工 review)
#
# 维护流程 (option B):
#   1. 每季度初由 AI 生成草案 PR
#   2. 人工 review：核对 lifecycle 阶段 + last_catalyst 日期 + decay_after 估计
#   3. 合并后通过 src/data/policy_themes.py 加载
#
# 字段约束（详见 schemas/policy.py PolicyTheme）：
#   id              稳定 slug，**不要改**，会破坏历史数据
#   tier            1=核心主线 / 2=受益方向 / 3=政策外延
#   lifecycle.phase 蓄势期 / 爆发期 / 退坡期 / 未知
#   keywords        子串包含即命中（粗匹配，宁多勿少）
#
# 当前快照基准日: 2026-04 (十四五收官 + 十五五开局)
# Review TODO: 红框字段为 AI 草稿估计值，请人工核对
#   - 所有 last_catalyst / next_window / decay_after 日期
#   - tier 等级（特别是 tier 1/2 边界）

themes:
  - id: ai_infrastructure
    name: 人工智能基础设施
    plan: 十五五
    pillar: 新质生产力
    tier: 1
    lifecycle:
      phase: 爆发期
      since: 2024-10-01           # 十四五末密集表态 → 十五五承接
      last_catalyst: 2026-03-05    # REVIEW: 估计为两会
      next_window: 2026-09-01      # REVIEW: 估计三季度部委细则
      decay_after: 2028-06-01      # REVIEW: 预期 2028 年中后周期切换
      notes: |
        覆盖大模型、算力中心、AI 芯片等子方向。爆发期建议持有，
        但需关注算力供给过剩信号 (decay_after 节点提前)。
    keywords:
      - 人工智能
      - 大模型
      - 算力
      - AI芯片
      - 智算中心
      - GPU
      - AIGC
    related_industries:
      - 计算机
      - 通信
      - 电子

